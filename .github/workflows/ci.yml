name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: python -m pytest -q
      - run: python scripts/make_sample.py && python scripts/evaluate.py --data data/sample
      - run: python scripts/train_ranker.py --data data/sample --rounds 100 --n-boot 100
      - run: python scripts/train_ranker.py --data data/sample --rounds 60 --n-boot 50
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-results
          path: |
            results/*.csv
            docs/frontier.png
